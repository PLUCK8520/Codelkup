# ============================================================
# Codelkup 前端 nginx 配置
#
# 两个职责：
#   1. 托管 Vue 打包出的静态文件，并把前端路由回退到 index.html
#   2. 反向代理 /api 与 /uploads 到后端容器
#
# 第 2 点是刻意的：前端的 axios baseURL 是相对路径 `/api`（见 src/utils/request.ts），
# 于是浏览器请求同源，**不需要任何 CORS 配置**，也不用在前端注入后端地址。
# 本地开发时由 vite 的 devServer.proxy 承担同一角色，两边行为一致。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传头像最大 5MB（与后端 multipart 限制一致），留一倍余量
    client_max_body_size 10m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 静态资源缓存策略 ----------
    # ⚠️ 这两处必须用 `^~` 前缀：nginx 的匹配顺序是
    #    「精确 = → ^~ 前缀 → 正则 → 最长普通前缀」，
    #    而下面有一条按扩展名匹配的正则 location（png/jpg/svg…）。
    #    如果这里写成普通前缀 `/assets/`，带 .png/.svg 后缀的请求会被那条正则抢走，
    #    nginx 会去自己的 root（/usr/share/nginx/html）找文件 → **必然 404**。
    #    实测踩过：部署后头像全部 404，本地开发却正常（开发时走 vite proxy 直连后端，
    #    根本不经过 nginx，所以只有"跑起来的生产栈"才暴露）。

    # 带内容 hash 的构建产物（/assets/xxx-HASH.js）可以放心长缓存
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存：它是"入口壳"，里面记录着当前版本的资源 hash。
    # 一旦被缓存，用户会拿旧壳去请求已被删除的旧资源，页面直接白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 字体等其他静态文件
    location ~* \.(woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---------- SSE 实时通道（必须单独一段）----------
    # 走 `= 精确匹配`：优先级高于下面的 `location /api/`，且只有这一条路径用长连接。
    # 四条缺一不可，少哪条都会表现为"事件延迟几十秒才到 / 连上就没反应"：
    #   1. proxy_buffering off —— nginx 默认会攒满一个 buffer 才把上游响应转发给客户端，
    #      对 SSE 就是"服务端推了但浏览器收不到"，直到攒够或连接结束；
    #   2. proxy_read_timeout 3600s —— 该超时是"两次收到上游数据之间的最大间隔"。
    #      后端心跳 25s（codelkup.sse.heartbeat-ms），设 60s 看着够，但网络抖一下
    #      或被中间设备缓冲就会误判超时；长连接的生死交给自己（后端 timeout-ms +
    #      前端重连），不由网关掐断；
    #   3. proxy_http_version 1.1 + 清空 Connection —— HTTP/1.0 的默认短连接会把流立刻关掉；
    #   4. gzip off —— 压缩会引入自己的缓冲，且 SSE 是低频小包，压不压都无收益。
    # 后端的响应头里另有一道 X-Accel-Buffering: no（同样的意思，换别的代理也生效）。
    location = /api/notifications/stream {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- API 反向代理 ----------
    # ⚠️ proxy_pass 后面**不能**跟路径（不能写成 http://backend:8085/），
    #    否则 nginx 会把 /api 前缀剥掉，后端收到的是 /posts 而不是 /api/posts，全部 404。
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ⚠️ 用 $remote_addr **覆盖**，不要用 $proxy_add_x_forwarded_for **追加**。
        #    追加会把客户端自带的伪造值原样留给后端（形如 "1.2.3.4, 真实IP"），
        #    后端只要误取第一段，客户端就能随意伪造自己的 IP ——
        #    而登录失败锁定是按「IP + 邮箱」计数的，伪造 IP 等于防爆破失效。
        #    本项目只有 nginx 这一层代理，覆盖后 XFF 里永远是真实客户端地址。
        #    后端侧另有一道：只有直连对端是可信代理时才采信该头
        #    （application.yml 的 server.forward-headers-strategy=native）。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传大文件时别过早超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 上传的静态资源（头像）同样由后端提供，路径前缀 /uploads 与后端配置一致
    # ⚠️ `^~` 不可省：否则会被上面那条按扩展名的正则 location 抢走（详见上方注释）
    location ^~ /uploads/ {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 头像内容不会变（文件名带随机串），可以缓存
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- API 文档 ----------
    # 后端 SecurityConfig 里 /v3/api-docs、/swagger-ui 本就是 permitAll（有意公开），
    # 但 nginx 只反代了 /api 与 /uploads —— 不加这两条，公网访问会落到 SPA 回退，
    # 拿到的是 index.html 而不是文档。演示站里"能点开 API 文档"是加分项，故显式放行。
    # `^~ /swagger-ui` 不带尾斜杠：这样 /swagger-ui.html 与 /swagger-ui/xxx 都能命中。
    location ^~ /v3/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
    }

    location ^~ /swagger-ui {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
    }

    # ---------- 指标端点：显式挡在公网之外（M3-10）----------
    # Prometheus 抓取走**容器网络**直连后端 8085（compose 不映射后端端口），
    # 公网侧这里明确 404。
    # ⚠️ 不写这条也不泄露（会落到下面的 `location /` 回退成 index.html），
    #    但"返回首页"会让人误以为路径存在 —— 404 才是明确的口径。
    location /actuator/ {
        return 404;
    }

    # ---------- SPA 路由回退 ----------
    # Vue Router 用 history 模式，/posts/123 这类路径在服务器上并不存在实体文件。
    # 找不到就回 index.html，交给前端路由处理；否则刷新页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 nginx 版本号（减少信息泄露）
    server_tokens off;
}
