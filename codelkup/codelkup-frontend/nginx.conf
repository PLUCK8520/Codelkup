# ============================================================
# Codelkup 前端 nginx 配置
#
# 两个职责：
#   1. 托管 Vue 打包出的静态文件，并把前端路由回退到 index.html
#   2. 反向代理 /api 与 /uploads 到后端容器
#
# 第 2 点是刻意的：前端的 axios baseURL 是相对路径 `/api`（见 src/utils/request.ts），
# 于是浏览器请求同源，**不需要任何 CORS 配置**，也不用在前端注入后端地址。
# 本地开发时由 vite 的 devServer.proxy 承担同一角色，两边行为一致。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传头像最大 5MB（与后端 multipart 限制一致），留一倍余量
    client_max_body_size 10m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 静态资源缓存策略 ----------
    # 带内容 hash 的构建产物（/assets/xxx-HASH.js）可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能缓存：它是"入口壳"，里面记录着当前版本的资源 hash。
    # 一旦被缓存，用户会拿旧壳去请求已被删除的旧资源，页面直接白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 字体等其他静态文件
    location ~* \.(woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---------- API 反向代理 ----------
    # ⚠️ proxy_pass 后面**不能**跟路径（不能写成 http://backend:8085/），
    #    否则 nginx 会把 /api 前缀剥掉，后端收到的是 /posts 而不是 /api/posts，全部 404。
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传大文件时别过早超时
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 上传的静态资源（头像）同样由后端提供，路径前缀 /uploads 与后端配置一致
    location /uploads/ {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 头像内容不会变（文件名带随机串），可以缓存
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- SPA 路由回退 ----------
    # Vue Router 用 history 模式，/posts/123 这类路径在服务器上并不存在实体文件。
    # 找不到就回 index.html，交给前端路由处理；否则刷新页面会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 nginx 版本号（减少信息泄露）
    server_tokens off;
}
