# ========== 服务端口 ==========
# ⚠️ 本机端口占用情况（2026-09-24 实测）：
#   8080~8083  → 被 VMware 的 vmnat.exe（系统服务，PID 5896）占用
#   65336      → 被 WorkBuddy 占用；且环境变量 SERVER__PORT=65336 会覆盖本配置
#   8085       → 空闲，本项目使用
# 若在其他机器运行，本项可被环境变量 SERVER_PORT 或启动参数 --server.port 覆盖。
server:
  port: ${SERVER_PORT:8085}
  # 优雅停机：等待在途请求处理完再退出，避免计数落库/通知丢失
  shutdown: graceful

  # ========== 客户端 IP 的信任边界（安全相关，别删）==========
  # 背景：登录失败锁定按「IP + 邮箱」计数（LoginAttemptService），
  #      浏览器浏览去重也按 IP 区分访客。若 IP 可被请求头伪造，这两个控制都会失效。
  #
  # native = 启用 Tomcat 的 RemoteIpValve：只有当**直连对端**落在 internal-proxies
  #      里（即确实来自我们自己的 nginx / 容器网络）时，才采信 X-Forwarded-For；
  #      直连的公网请求自带的伪造 XFF 一律不采信，remoteAddr 保持真实 socket 地址。
  #      配合前端 nginx 侧「覆盖而非追加」XFF（见 nginx.conf），伪造值进不来也信不过。
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # 可信代理网段：本机回环 + RFC1918 私有网段（Docker 默认 bridge 为 172.16~172.31，
      # 若自定义了 compose network 的子网，需同步加进来）
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2\d\.\d{1,3}\.\d{1,3}|172\.3[01]\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'

spring:
  application:
    name: codelkup

  profiles:
    active: dev

  # ========== 数据源 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：characterEncoding 需填 Java 字符集名 UTF-8，不能填 MySQL 的 utf8mb4
    # （utf8mb4 是服务端字符集名，JDBC 不认，会抛 Unsupported character encoding）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:codelkup}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:codelkup}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ========== Redis ==========
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ========== MVC ==========
  mvc:
    # 让不存在的路径抛 NoHandlerFoundException，交由 GlobalExceptionHandler 处理，
    # 否则会被兜底分支当成 500 系统错误（语义错误）
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # 关闭默认的静态资源兜底 Handler，配合上一项使 NoHandlerFoundException 真正生效
      add-mappings: false
  # ========== Jackson ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ========== 文件上传 ==========
  servlet:
    multipart:
      # 容器层上限比业务上限（codelkup.upload.max-image-size-mb=5）宽一档：
      # 超限请求会先被容器拦下，由 GlobalExceptionHandler 翻成 40005 的可读提示
      max-file-size: 6MB
      max-request-size: 12MB

  # ========== Flyway ==========
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true

# ========== MyBatis-Plus ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.codelkup.module
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # dev 环境打印 SQL；prod 覆盖
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== SpringDoc ==========
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ========== Actuator ==========
management:
  endpoints:
    web:
      exposure:
        # prometheus（M3-10）：只应被**容器网络内**的抓取方访问 ——
        # compose 不映射后端端口，nginx 另有 `location /actuator/ { return 404; }`
        # 显式挡在公网之外。不要靠"没人知道这个路径"来保护指标。
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    # 所有指标统一带上应用名，便于多服务共用一个 Prometheus 时区分
    tags:
      application: codelkup

# ========== 业务自定义配置 ==========
codelkup:
  # 注册开关（PRE-MORTEM T0-2）：演示/生产站建议 false，防止公网被扫到后灌垃圾注册。
  # 关闭时 POST /api/auth/register 一律 40304；前端注册页经 /api/system/config 提前显示"暂未开放"。
  # 登录 / 演示账号 / 其它功能完全不受影响。默认 true 以保证本地开发与验收脚本可用。
  auth:
    registration-enabled: ${REGISTRATION_ENABLED:true}
  jwt:
    # 生产环境必须通过环境变量覆盖；dev 环境在 application-dev.yml 中提供默认值
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:1800}       # 30 分钟
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}   # 7 天
    issuer: codelkup
  cors:
    # 开发期前端 dev server 的地址（vite.config.ts 的 server.port）。
    # ⚠️ 5273 是本项目的端口；5173 保留在列表里只是为了让"旧书签/旧终端"不至于突然跨域失败，
    #    新环境只需要 5273 这一项。生产走 nginx 同源反代，用不到 CORS。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5273,http://localhost:5173}
  # ========== 限流阈值（防枚举 / 防口令喷洒）==========
  # 默认值就是"保守口径"：注册 5 次/小时/IP、登录失败 30 次/10 分钟/IP。
  # ⚠️ 什么时候该调大：
  #   1) 部署在共享出口 IP（办公 / 校园 NAT）—— 阈值按"I 个出口 IP"计数，会互相影响
  #   2) 需要在一小时内重复跑 verify-sprint*.py（脚本单次会注册 5 个用户）
  #   调小则更严格；调大后记得同步 verify-v03-security.py 的断言口径。
  # 说明见上。upload / post / comment 三个桶按**用户**计（创作与上传必然登录），
  # 上面的 register / login-ip-max 按 IP 计。
  rate-limit:
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
    login-ip-max: ${RATE_LIMIT_LOGIN_IP_MAX:30}
    # 图片上传：30 次/小时/用户
    upload-per-hour: ${RATE_LIMIT_UPLOAD_PER_HOUR:30}
    # 发帖：20 帖/小时/用户
    post-per-hour: ${RATE_LIMIT_POST_PER_HOUR:20}
    # 评论：60 条/小时/用户
    comment-per-hour: ${RATE_LIMIT_COMMENT_PER_HOUR:60}
    # 举报：20 次/小时/用户（正常用户一小时遇不到 20 条该举报的内容；
    # 给到 20 是为了不误伤"翻旧帖时连续举报"的场景，同时把批量举报的成本压住）
    report-per-hour: ${RATE_LIMIT_REPORT_PER_HOUR:20}
    # 草稿自动保存：240 次/小时/用户（前端 15 秒节流 ≈ 每分钟最多 4 次，留了约 1/3 余量；
    # 超限时前端静默降级为只写本地草稿，不会打断编辑）
    draft-per-hour: ${RATE_LIMIT_DRAFT_PER_HOUR:240}
    # SSE ticket 签发：120 次/小时/用户（正常一次连接换一张；前端重连也远低于此）
    sse-ticket-per-hour: ${RATE_LIMIT_SSE_TICKET_PER_HOUR:120}
    # 相似问题提示：300 次/小时/用户（编辑器里边写边问，去抖后一次会话约 20~50 次；
    # 不调 LLM，只是检索 + 重排，所以额度给得比 AI 问答宽）
    similar-per-hour: ${RATE_LIMIT_SIMILAR_PER_HOUR:300}
    # RAG 问答 + 长帖 TL;DR：10 次/小时/用户（ALIGNMENT 口径）。
    # ⚠️ 两者**共用这一个桶**：都真花钱，分开计等于把每人的额度翻倍 ——
    #    "AI 生成类调用按用户 10/小时"才是成本闸门的原意。
    ai-per-hour: ${RATE_LIMIT_AI_PER_HOUR:10}
    # ---------- 以下六项为 L-4 安全加固补齐（此前这些写接口没有桶） ----------
    # 点赞 / 取消（帖子）：300 次/小时/用户。循环 like↔unlike 的成本在计数与事件上，
    # 300（≈5 次/分钟）对真实浏览绰绰有余，对脚本循环是硬约束。
    like-per-hour: ${RATE_LIMIT_LIKE_PER_HOUR:300}
    # 收藏 / 取消：同一口径
    collect-per-hour: ${RATE_LIMIT_COLLECT_PER_HOUR:300}
    # 评论点赞 / 取消：同一口径（与帖子点赞分开计数，互不挤占）
    comment-like-per-hour: ${RATE_LIMIT_COMMENT_LIKE_PER_HOUR:300}
    # 关注 / 取关：60 次/小时/用户 —— 每次关注都会给对方发通知（同源去重只挡未读合并），
    # 循环关注/取关是通知骚扰的放大器
    follow-per-hour: ${RATE_LIMIT_FOLLOW_PER_HOUR:60}
    # 刷新凭证：120 次/小时/IP（未认证接口按 IP；access 30 分钟一换 ≈ 每设备 2 次/小时）
    refresh-per-hour: ${RATE_LIMIT_REFRESH_PER_HOUR:120}
    # 修改资料：30 次/小时/用户（昵称/简介是公开展示面，防高频篡改）
    profile-per-hour: ${RATE_LIMIT_PROFILE_PER_HOUR:30}
    # 编辑帖子：30 次/小时/用户（防高频改写；正常编辑远低于此）
    post-edit-per-hour: ${RATE_LIMIT_POST_EDIT_PER_HOUR:30}
  # ========== SSE 实时通道（V0.3 M3-1）==========
  # 通知单向推送用 SSE（ADR-3）：无需协议升级，Spring MVC 原生支持。
  # 鉴权用一次性 ticket（ADR-8）：EventSource 不能带 Header，token 也不能进 URL。
  sse:
    # ticket 有效期（秒）：签约后必须在此窗口内完成连接，消费即作废（GETDEL）
    ticket-ttl-seconds: ${SSE_TICKET_TTL_SECONDS:60}
    # 心跳间隔（毫秒）：发注释帧（:ping），只维持连接、不触发前端事件。
    # ⚠️ 必须小于反向代理的 read timeout，否则连接会被代理先掐断（nginx 侧见 M3-2）
    heartbeat-ms: ${SSE_HEARTBEAT_MS:25000}
    # 服务端连接超时（毫秒）：到点自动关闭，让前端重连 —— 防半开连接长期占资源。
    # 默认 30 分钟；前端在收到关闭后会重新换 ticket 再连
    timeout-ms: ${SSE_TIMEOUT_MS:1800000}
    # 单用户最大并发连接数（多标签）：超出时关掉其中一个旧连接，保证新连接可用
    max-connections-per-user: ${SSE_MAX_CONNECTIONS_PER_USER:5}
  # ========== AI 客户端（V0.3 M3-4 / M3-11 / ADR-1）==========
  # 走 OpenAI 兼容端点（默认 DeepSeek），两个**可切换**实现（键见下面的 impl）：
  #   rest（默认） = Spring 6.1 的 RestClient 手写版，零框架依赖
  #   spring-ai    = Spring AI 的 OpenAiChatModel 版（+6 个 jar / 0.8MB，见 pom 的说明）
  # ⚠️ 没有 key = "AI 未启用"这个**正常状态**：available() 返回 false、
  #    chat() 直接返回降级结果（不发请求），其它功能不受任何影响。
  ai:
    # 实现选择（M3-11）：`rest` = 自写的 RestClient 版（默认，零框架依赖、超时与"不重试"完全可控）
    #                   `spring-ai` = Spring AI 的 OpenAiChatModel 版（需要 spring-ai-openai 依赖）
    # ⚠️ 两个实现读的是**同一份** codelkup.ai.* 配置，切换只影响"谁来发这个请求"；
    #    写错（既不是 rest 也不是 spring-ai）会导致启动时找不到 AiClient 而失败 —— 这是有意的 fail-fast。
    impl: ${AI_IMPL:rest}
    # 总开关：关掉后即使配了 key 也不调用（线上临时止血用，不必改 key）
    enabled: ${AI_ENABLED:true}
    # ⚠️ 不提供默认密钥（DoD 第 5 条）：密钥只能从环境变量 / .env 注入。
    #    留空即"未启用"，不是错误。
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    model: ${AI_MODEL:deepseek-chat}
    # 连接与读取超时（毫秒）。8 秒既是"用户还能等"的上限，也与 M3-9 的 P95 ≤8s 目标一致
    timeout-ms: ${AI_TIMEOUT_MS:8000}
    # 单次回答上限与采样温度的默认值（调用方可在请求里覆盖）
    max-tokens: ${AI_MAX_TOKENS:800}
    temperature: ${AI_TEMPERATURE:0.3}
    # ---- RAG 问答（M3-6）----
    # 检索片段数：进 prompt 的条数，也是引用编号 [1..n] 的上限
    top-k: ${AI_TOP_K:5}
    # 全站日预算（次/天）：成本即攻击面的第三道闸门。
    # 只在实际调用 LLM 前计数 —— 命中缓存的请求不消耗（它确实没花钱）
    daily-budget: ${AI_DAILY_BUDGET:2000}
    # 问题指纹缓存时长（小时）：同一个问题只付一次费
    cache-ttl-hours: ${AI_CACHE_TTL_HOURS:6}
    # 长帖 TL;DR 的正文上限（字符）：超长帖先剥离 Markdown、再截到这么多字进 prompt。
    # 25000 字的帖子实测正文剥完约 2 万字，截到 6000 字既保住开头要点，
    # 又把 prompt 稳定在"8 秒超时"能覆盖的量级（§10.4 同样口径：不依赖分词器）
    summary-max-input-chars: ${AI_SUMMARY_MAX_INPUT_CHARS:6000}
  # ========== 热度分（hot 排序的真实数据来源）==========
  # 模型：MySQL 只存"当前分数"这一列，由定时任务一条 SQL 全量重算。
  #   不做增量维护 —— 时间衰减是随当前时间连续变化的量，增量更新要在读取时补偿，
  #   反而复杂且容易漂移；1 万帖量级全量重算 < 1s，每 5 分钟一次可忽略。
  # 公式：score = (1 + 2*赞 + 3*藏 + 4*评) * e^(-λ * 距最后活跃小时数)
  #   λ=0.02 → 半衰期约 34.7 小时（"一天半前的热度折半"）
  score:
    enabled: ${SCORE_ENABLED:true}
    like-weight: ${SCORE_LIKE_WEIGHT:2}
    collect-weight: ${SCORE_COLLECT_WEIGHT:3}
    comment-weight: ${SCORE_COMMENT_WEIGHT:4}
    decay-lambda: ${SCORE_DECAY_LAMBDA:0.02}
    # 启动后首跑延迟与执行间隔（验收脚本会调到秒级，好在一次运行内看到分数变化）
    initial-delay-ms: ${SCORE_INITIAL_DELAY_MS:30000}
    interval-ms: ${SCORE_INTERVAL_MS:300000}
  upload:
    # 上传文件的存储根目录（相对路径基于进程工作目录）
    # ⚠️ 生产环境应指向独立的数据卷，不要放在代码目录下
    root: ${UPLOAD_ROOT:./uploads}
    # 对外访问前缀，需与 WebMvcConfig 的资源映射一致
    url-prefix: /uploads
    # 正文配图单文件上限（MB）。前端粘贴上传会先压到长边 1600 的 WebP，正常远小于此值；
    # 容器层 spring.servlet.multipart 的 6MB 比它宽一档，好让超限走业务提示而不是容器 500
    max-image-size-mb: ${UPLOAD_MAX_IMAGE_MB:5}
    # 单用户正文配图文件数上限（防滥用阈值，不是正常使用门槛；调大即可放宽）
    max-files-per-user: ${UPLOAD_MAX_FILES_PER_USER:200}

logging:
  level:
    root: INFO
    com.codelkup: DEBUG
