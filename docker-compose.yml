# ============================================================
# Codelkup 一键启动编排
#
# 用法：
#   cp .env.example .env      # 然后按需修改（.env 不进版本库）
#   docker compose up -d --build
#   打开 http://localhost:8080
#
# 设计取舍（都是有意为之，不是随手写的）：
#   1. **MySQL / Redis 不对宿主机暴露端口**。它们只在本编排的内部网络里被
#      后端访问。好处：不会和你本地已装的 MySQL(3306)、已有的 redis 容器(6379)
#      抢端口 —— 本项目本地开发用的是本机 MySQL + 手跑的 codelkup-redis 容器，
#      如果 compose 也去绑 3306/6379 就会直接冲突起不来。
#      需要进去调试时，用 `docker compose exec mysql mysql -u...` 即可。
#   2. **只对外暴露前端一个端口**（默认 8080）。前端 nginx 反代 /api 与 /uploads，
#      前后端同源，因此不需要任何 CORS 配置。
#   3. **用 service_healthy 而不是简单的 depends_on**。`depends_on` 默认只保证
#      "容器启动了"，不保证"服务能用了"。Spring Boot 启动比 MySQL 快得多，
#      若不等 MySQL 真正 ready，后端首次连接会失败（Flyway 迁移直接报错退出）。
# ============================================================

name: codelkup

services:
  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-codelkup}
      MYSQL_USER: ${DB_USERNAME:-codelkup}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    # ⚠️ ngram_token_size=2 是**必须**的：项目的中文全文检索依赖 ngram 分词器，
    #    而这是一个只读变量，只能在服务启动时设定、不能运行时改。
    #    MySQL 8.0 默认值恰好是 2，但显式写出来才能保证换 MySQL 版本/镜像时行为不变。
    #    （若这个值被改动，Sprint 4 的检索会静默失效 —— 搜索单字或短词返回空。）
    # ⚠️ 关闭停用词过滤（2026-09-28 补）：默认停用词表含单字母 "a"，会让
    #    "所有双字组都含 a" 的词（java → ja/av/va、kafka、data…）被 ngram
    #    过滤吞掉、MATCH 恒 0 条（见 V13 迁移的完整取证）。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --ngram_token_size=2
      - --innodb-ft-enable-stopword=OFF
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用 root 探活而不是业务账号：首次初始化时业务账号可能还没建好
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - codelkup-net

  # ---------------- Redis ----------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # 第四轮审计：Redis 此前**无认证** —— 同一网络内任意容器（或被攻陷的后端进程）
      # 可读写 SSE 票据 / 限流桶 / 会话撤销水位。现在强制要求口令；
      # healthcheck 也必须带认证（开 requirepass 后未认证 PING 直接 NOAUTH）。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    # appendonly：计数走 Redis，开启 AOF 后重启不会丢增量
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - codelkup-net

  # ---------------- 后端 ----------------
  backend:
    build:
      context: ./codelkup/codelkup-backend
    image: codelkup-backend:latest
    restart: unless-stopped
    environment:
      # prod profile：不打印 SQL、Flyway 禁止 clean、日志级别收紧
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-codelkup}
      DB_USERNAME: ${DB_USERNAME:-codelkup}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      # 生产环境必须由外部注入，代码里没有默认值（application.yml 写的就是 ${JWT_SECRET}）
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      # 上传目录指向数据卷挂载点（Dockerfile 里已建好并设了属主）
      UPLOAD_ROOT: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # ---------- 注册开关（PRE-MORTEM T0-2）----------
      # ⚠️ environment 是显式白名单：**不写在这里的变量不会进容器**，.env 里设了也无效
      #    （第二轮审计 F4 实证 —— 上线自检会读 /api/system/config 验证它真的生效）。
      # 默认值取 false（第三轮审计）：fail-safe —— 漏配时是"注册关闭"（安全侧），
      #    而不是"公网注册开着"。本地演练要开注册请在 .env 里显式写 true
      #    （.env.example 已给 true，seed-demo 需要建 6 个演示账号）。
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      # ---------- 限流阈值（L-4 起全部可配；不写则用 application.yml 默认）----------
      # 共享出口 IP（办公/校园 NAT）被注册限流误伤、或演示站要放宽/收紧时，在 .env 覆盖即可。
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-5}
      RATE_LIMIT_LOGIN_IP_MAX: ${RATE_LIMIT_LOGIN_IP_MAX:-30}
      # 纯邮箱维度（第五轮审计 #1）：跨 IP 挡定向爆破；不写则 15/60 分钟
      RATE_LIMIT_LOGIN_EMAIL_MAX: ${RATE_LIMIT_LOGIN_EMAIL_MAX:-15}
      RATE_LIMIT_UPLOAD_PER_HOUR: ${RATE_LIMIT_UPLOAD_PER_HOUR:-30}
      RATE_LIMIT_POST_PER_HOUR: ${RATE_LIMIT_POST_PER_HOUR:-20}
      RATE_LIMIT_COMMENT_PER_HOUR: ${RATE_LIMIT_COMMENT_PER_HOUR:-60}
      RATE_LIMIT_REPORT_PER_HOUR: ${RATE_LIMIT_REPORT_PER_HOUR:-20}
      RATE_LIMIT_DRAFT_PER_HOUR: ${RATE_LIMIT_DRAFT_PER_HOUR:-240}
      RATE_LIMIT_SSE_TICKET_PER_HOUR: ${RATE_LIMIT_SSE_TICKET_PER_HOUR:-120}
      RATE_LIMIT_SIMILAR_PER_HOUR: ${RATE_LIMIT_SIMILAR_PER_HOUR:-300}
      # 搜索：登录按用户 / 匿名按 IP（第五轮审计补齐，见 SearchController 的注释）
      RATE_LIMIT_SEARCH_PER_HOUR: ${RATE_LIMIT_SEARCH_PER_HOUR:-300}
      RATE_LIMIT_SEARCH_IP_PER_HOUR: ${RATE_LIMIT_SEARCH_IP_PER_HOUR:-60}
      RATE_LIMIT_AI_PER_HOUR: ${RATE_LIMIT_AI_PER_HOUR:-10}
      RATE_LIMIT_LIKE_PER_HOUR: ${RATE_LIMIT_LIKE_PER_HOUR:-300}
      RATE_LIMIT_COLLECT_PER_HOUR: ${RATE_LIMIT_COLLECT_PER_HOUR:-300}
      RATE_LIMIT_COMMENT_LIKE_PER_HOUR: ${RATE_LIMIT_COMMENT_LIKE_PER_HOUR:-300}
      RATE_LIMIT_FOLLOW_PER_HOUR: ${RATE_LIMIT_FOLLOW_PER_HOUR:-60}
      RATE_LIMIT_REFRESH_PER_HOUR: ${RATE_LIMIT_REFRESH_PER_HOUR:-120}
      RATE_LIMIT_PROFILE_PER_HOUR: ${RATE_LIMIT_PROFILE_PER_HOUR:-30}
      RATE_LIMIT_POST_EDIT_PER_HOUR: ${RATE_LIMIT_POST_EDIT_PER_HOUR:-30}
      # ---------- AI 客户端（M3-4）----------
      # ⚠️ 不配 AI_API_KEY 就是"AI 未启用"：相关接口降级返回（仅检索结果 + 提示），
      #    其余功能完全不受影响。默认值刻意留空 —— 密钥只从 .env / 环境注入。
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # 实现选择（M3-11）：rest（默认）| spring-ai。两者读同一份上面的配置
      AI_IMPL: ${AI_IMPL:-rest}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-2000}
      # JVM 堆上限：容器里默认按宿主机物理内存算堆，小内存 VPS 上会和 MySQL 抢内存
      # 被 OOM Kill。2C2G 建议 35~40，2C4G 建议 55（见 deploy/.env.production.example）
      JVM_MAX_RAM_PERCENTAGE: ${JVM_MAX_RAM_PERCENTAGE:-75.0}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codelkup-net

  # ---------------- 前端 ----------------
  frontend:
    build:
      context: ./codelkup/codelkup-frontend
    image: codelkup-frontend:latest
    restart: unless-stopped
    ports:
      # 唯一对宿主机暴露的端口。8080 而不是 80：Windows 上 80 常被占用，
      # 且不占 5273/8085 —— 那两个是本地开发用的（vite dev server / 后端 jar）。
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codelkup-net

networks:
  codelkup-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  uploads-data:
